name: CI

on:
  push:
    branches: [main]
  pull_request:

# The checks that need no database and no API keys. They are the ones worth
# blocking a merge on: everything else needs credentials this repo doesn't have.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Tests
        run: npm test
