name: CI

on:
  push:
    branches: [main]
  pull_request:

# The checks that need no database and no API keys. They are the ones worth
# blocking a merge on: everything else needs credentials this repo doesn't have.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm install`, not `npm ci`. The lockfile is generated on Windows, so it
      # records only the Windows build of the platform-specific binaries some
      # dependencies ship. `npm ci` refuses a lockfile that doesn't already list
      # the packages this runner needs; `npm install` resolves them for whatever
      # platform it's on. Contributors on macOS would hit the same wall.
      - run: npm install --no-audit --no-fund

      # Next generates route types (LayoutProps, PageProps) into .next/types,
      # which tsconfig includes. Locally they exist because the dev server has
      # been run; a fresh checkout has never built anything, so tsc fails on
      # names it cannot find. typegen produces them without a full build.
      - name: Generate route types
        run: npx next typegen

      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Tests
        run: npm test
